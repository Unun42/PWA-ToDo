# Checks both apps on every push and pull request.
name: CI

on:
    push:
    pull_request:

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: api/package-lock.json
            - run: npm ci
            - run: npm test

    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: web/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
