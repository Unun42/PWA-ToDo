services:
    - type: web
      name: todo-api
      runtime: node
      rootDir: api
      plan: free
      buildCommand: npm ci
      startCommand: npm start
      healthCheckPath: /health
      envVars:
          - key: TURSO_DATABASE_URL
            sync: false
          - key: TURSO_AUTH_TOKEN
            sync: false
          - key: CORS_ORIGIN
            sync: false
